[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusboard"
version = "1.0.0"
description = "A dependency-free SQLite task manager for the command line"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FocusBoard contributors" }]
dependencies = []

[project.scripts]
focusboard = "focusboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
